<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمد حللي علي الحللي | تقنية معلومات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a0b10; color: #f8f9fa; margin: 0; padding: 40px; direction: rtl; text-align: right; }
        .card { max-width: 700px; margin: 50px auto; background: #13151f; border: 1px solid rgba(255, 215, 0, 0.3); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ffd700; font-size: 2rem; margin-bottom: 10px; }
        .badge { background: rgba(255, 215, 0, 0.1); color: #ffd700; padding: 6px 15px; border-radius: 20px; display: inline-block; font-size: 0.9rem; margin-bottom: 20px; }
        p { color: #a0a5b8; line-height: 1.8; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">الجامعة التخصصية الحديثة - تقنية معلومات (المستوى الثالث)</span>
        <h1>محمد حللي علي الحللي</h1>
        <p>مرحباً بكم في موقعي التعريفي. أنا الطالب محمد حللي علي الحللي، أدرس في تخصص تقنية معلومات، وأعمل في تطوير الواجهات الأمامية وأمن الشبكات.</p>
    </div>
</body>
</html>
